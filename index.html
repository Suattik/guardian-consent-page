<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Einladung · Lernumo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <div class="card">
    <div class="logo" aria-hidden="true">👪</div>
    <span class="pill">Einladung für Eltern</span>
    <h1 id="title">Einladung wird geprüft …</h1>
    <div id="content" aria-live="polite"></div>
  </div>
  <div class="footer">Lernumo · sichere Eltern-Einladung</div>
</main>
<script>
(function () {
  'use strict';
  var endpoint = 'https://hgnodunvurreehadpdab.supabase.co/functions/v1/parent-invite';
  var params = new URLSearchParams(location.search);
  var token = (params.get('invite') || '').trim();
  var titleEl = document.getElementById('title');
  var content = document.getElementById('content');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function show(title, nodes) {
    titleEl.textContent = title;
    content.replaceChildren.apply(content, nodes);
  }
  function fail(title, message) {
    show(title, [el('div', 'error', message)]);
  }

  // Links aus älteren Nachrichten (früheres Freigabe-Verfahren mit PIN).
  if (params.has('legacy') || params.has('consent')) {
    fail('Dieser Link stammt aus einer älteren Version',
      'Die Elternfreigabe funktioniert jetzt anders: Das Kind erstellt in Lernumo eine neue Einladung, ' +
      'und du legst dein eigenes Elternkonto an. Bitte das Kind, unter „Eltern einladen“ eine neue Einladung zu senden.');
    return;
  }

  // Kein Token in der Adresse: der Link wurde gekürzt oder ohne Parameter geöffnet.
  if (!token) {
    fail('Einladung nicht vollständig',
      'In der Adresse fehlt der Einladungscode. Öffne den Link erneut direkt aus der Nachricht ' +
      '(nicht aus einer Vorschau) oder bitte das Kind, die Einladung erneut zu senden.');
    return;
  }

  function renderInstructions() {
    var code = el('div', 'code', token);
    var copy = el('button', '', 'Code kopieren');
    copy.type = 'button';
    copy.addEventListener('click', function () {
      var done = function () { copy.textContent = 'Kopiert ✓'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(token).then(done, function () { selectCode(); });
      } else { selectCode(); }
    });
    function selectCode() {
      var range = document.createRange();
      range.selectNodeContents(code);
      var selection = getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      copy.textContent = 'Code markiert – jetzt kopieren';
    }
    var steps = el('ol', 'steps');
    ['Installiere und öffne die Lernumo-App.',
     'Tippe auf „Elternzugang“ und dann auf „Einladung annehmen“.',
     'Füge den Code ein (oder den kompletten Link) und lege dein eigenes Elternkonto mit deiner E-Mail-Adresse an.',
     'Bestätige die Einladung. Danach siehst du den Lernfortschritt im Eltern-Dashboard.'
    ].forEach(function (text) { steps.appendChild(el('li', '', text)); });
    return [
      el('p', '', 'Dein Einladungscode:'), code, copy, steps,
      el('div', 'info', 'Der Code gilt einmal und 7 Tage. Du brauchst dafür keine bestimmte E-Mail-Adresse und keinen PIN. Gib den Code nicht an Dritte weiter.')
    ];
  }

  fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'preview', token: token })
  }).then(function (response) {
    return response.json().catch(function () { return {}; });
  }).then(function (data) {
    if (data.state === 'pending') {
      var name = data.childName || 'Dein Kind';
      show(name + ' lädt dich zu Lernumo ein', renderInstructions());
    } else if (data.state === 'expired') {
      fail('Einladung abgelaufen', data.message);
    } else if (data.state === 'used') {
      fail('Einladung bereits verwendet', data.message);
    } else if (data.state === 'revoked') {
      fail('Einladung zurückgezogen', data.message);
    } else {
      fail('Einladung nicht gefunden', data.message ||
        'Diese Einladung ist unbekannt. Bitte den Link erneut aus der neuesten Nachricht öffnen.');
    }
  }).catch(function () {
    // Kein Netz: Der Code ist trotzdem gültig und kann in der App eingegeben werden.
    show('Keine Verbindung', [
      el('div', 'error', 'Die Einladung konnte gerade nicht geprüft werden. Der Code kann trotzdem in der App verwendet werden.')
    ].concat(renderInstructions()));
  });
})();
</script>
</body>
</html>
